<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>窄路</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%;
    background: #2d3d22;
    color: #f4f1ea;
    font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", "Heiti SC", sans-serif;
    user-select: none; overflow: hidden;
  }
  body { display: flex; justify-content: center; }
  #app {
    width: 100%; max-width: 430px; height: 100%; height: 100dvh;
    display: flex; flex-direction: column; position: relative; overflow: hidden;
    background: #2d3d22;
  }
  header {
    flex: 0 0 auto;
    padding: 6px 10px 4px;
    padding-top: max(6px, env(safe-area-inset-top));
    background: rgba(20,28,14,0.35);
  }
  .hud { display: grid; grid-template-columns: 1fr 1fr 1fr 1.1fr; gap: 5px; }
  .stat {
    background: rgba(18,24,12,0.45); border-radius: 8px; padding: 5px 7px;
    min-height: 38px;
  }
  .stat .k { font-size: 10px; color: #dce6d0; opacity: 0.8; }
  .stat .v { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat.gold .v { color: #e6c35c; }
  .stat.life .v { color: #e07070; }
  #stage { flex: 1 1 auto; min-height: 0; position: relative; }
  canvas { display: block; touch-action: none; width: 100%; height: 100%; }
  footer {
    flex: 0 0 auto;
    padding: 6px 8px max(8px, env(safe-area-inset-bottom));
    background: rgba(20,28,14,0.35);
  }
  .bar { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .card {
    appearance: none; font-family: inherit; min-height: 58px; border-radius: 10px;
    border: 2px solid rgba(255,255,255,0.18); background: rgba(24,32,16,0.55);
    color: #f4f1ea; display: flex; flex-direction: column; align-items: center;
    justify-content: center; cursor: pointer; padding: 4px;
  }
  .card.selected { border-color: #e6c35c; background: rgba(50,64,28,0.75); }
  .card.disabled { opacity: 0.4; }
  .card .name { font-size: 14px; font-weight: 700; }
  .card .cost { font-size: 12px; color: #e6c35c; }
  .overlay {
    position: absolute; inset: 0; background: rgba(8,12,6,0.62);
    display: none; align-items: center; justify-content: center;
    flex-direction: column; gap: 10px; z-index: 5; text-align: center;
  }
  .overlay.show { display: flex; }
  .overlay h2 { margin: 0; font-size: 32px; letter-spacing: 0.18em; }
  #restart {
    min-height: 44px; min-width: 160px; border: 0; border-radius: 12px;
    background: #7cb36a; color: #142010; font-size: 16px; font-weight: 800;
    font-family: inherit; cursor: pointer;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="hud">
      <div class="stat gold"><div class="k">金</div><div class="v" id="gold">50</div></div>
      <div class="stat life"><div class="k">命</div><div class="v" id="lives">10</div></div>
      <div class="stat"><div class="k">波</div><div class="v" id="wave">1/10</div></div>
      <div class="stat"><div class="k">下一波</div><div class="v" id="next">5.0</div></div>
    </div>
  </header>
  <div id="stage"><canvas id="cv"></canvas></div>
  <footer>
    <div class="bar">
      <button type="button" class="card" data-type="arrow" id="card-arrow"><div class="name">箭</div><div class="cost">50</div></button>
      <button type="button" class="card" data-type="ice" id="card-ice"><div class="name">冰</div><div class="cost">70</div></button>
      <button type="button" class="card" data-type="cannon" id="card-cannon"><div class="name">炮</div><div class="cost">120</div></button>
    </div>
  </footer>
  <div class="overlay" id="overlay">
    <h2 id="ov-title">胜利</h2>
    <p id="ov-sub"></p>
    <button type="button" id="restart">重新开始</button>
  </div>
</div>
<script>
(() => {
  const COLS = 7, ROWS = 13;
  const PATH = [
    [1,0],[1,1],[1,2],[2,2],[3,2],[4,2],
    [4,3],[4,4],[4,5],[3,5],[2,5],[1,5],
    [1,6],[1,7],[1,8],[2,8],[3,8],[4,8],
    [4,9],[4,10],[4,11],[5,11],[6,11]
  ];
  const PATH_SET = new Set(PATH.map(([c,r]) => c + "," + r));
  const PATH_LEN = PATH.length;
  // 画上路的 UV（入口在图上右，出口在图下中），逻辑格子仍是上面那条 S
  const PATH_UV = [
    [0.7367, 0.1009],[0.7062, 0.1330],[0.6751, 0.1592],[0.6406, 0.1776],[0.6063, 0.1934],
    [0.5845, 0.2373],[0.5872, 0.2930],[0.5691, 0.3398],[0.5420, 0.3783],[0.5120, 0.4116],
    [0.4856, 0.4502],[0.4821, 0.5048],[0.4895, 0.5583],[0.5172, 0.5957],[0.5442, 0.6343],
    [0.5665, 0.6775],[0.5702, 0.7328],[0.5544, 0.7809],[0.5269, 0.8188],[0.4996, 0.8570],
    [0.4727, 0.8958],[0.4594, 0.9445],[0.4340, 0.9856]
  ];
  // 石台中心对格。前三座按美术像素钉死（1536×1024 左上原点），其余沿路空台。
  const PADS = [
    { c: 2, r: 1, u: 540/1536, v: 300/1024, painted: true },
    { c: 5, r: 4, u: 1140/1536, v: 490/1024, painted: true },
    { c: 0, r: 5, u: 250/1536, v: 640/1024, painted: true },
    { c: 3, r: 4, u: 0.4935, v: 0.3027, painted: false },
    { c: 0, r: 2, u: 0.7773, v: 0.2559, painted: false },
    { c: 3, r: 6, u: 0.5599, v: 0.4453, painted: false },
    { c: 2, r: 9, u: 0.7943, v: 0.5977, painted: false },
    { c: 3, r: 9, u: 0.7318, v: 0.7871, painted: false },
    { c: 5, r: 9, u: 0.4310, v: 0.7402, painted: false },
    { c: 3, r: 11, u: 0.2161, v: 0.8203, painted: false },
    { c: 3, r: 7, u: 0.4792, v: 0.7188, painted: false }
  ];
  const TOWER_DEF = {
    arrow:  { name: "箭", cost: 50,  dmg: 8,  rate: 1.0, range: 2.5, splash: 0, slow: 0 },
    ice:    { name: "冰", cost: 70,  dmg: 3,  rate: 0.8, range: 2.0, splash: 0, slow: 0.4 },
    cannon: { name: "炮", cost: 120, dmg: 22, rate: 0.45,range: 2.0, splash: 1, slow: 0 }
  };
  const WAVES = [
    { count: 6,  hp: 10, gold: 8,  interval: 1.2 },
    { count: 8,  hp: 14, gold: 8,  interval: 1.1 },
    { count: 8,  hp: 20, gold: 9,  interval: 1.0 },
    { count: 10, hp: 26, gold: 9,  interval: 1.0 },
    { count: 10, hp: 34, gold: 10, interval: 0.9 },
    { count: 12, hp: 42, gold: 10, interval: 0.9 },
    { count: 12, hp: 54, gold: 11, interval: 0.8 },
    { count: 14, hp: 68, gold: 11, interval: 0.8 },
    { count: 14, hp: 84, gold: 12, interval: 0.75 },
    { count: 16, hp: 100,gold: 12, interval: 0.7 }
  ];

  const canvas = document.getElementById("cv");
  const ctx = canvas.getContext("2d");
  const stage = document.getElementById("stage");
  const overlay = document.getElementById("overlay");
  const IMG = {};
  const IMG_SRC = {
    map: "assets/battlefield.png",
    pad: "assets/tile-pad.png",
    arrow: "assets/tower-arrow.png",
    ice: "assets/tower-ice.png",
    cannon: "assets/tower-cannon.png",
    place: "assets/fx-place.png",
    splash: "assets/fx-splash.png",
    slow: "assets/fx-ice.png"
  };
  function loadImages(done) {
    const keys = Object.keys(IMG_SRC);
    let n = 0;
    keys.forEach(k => {
      const im = new Image();
      im.onload = im.onerror = () => { n++; if (n >= keys.length) done(); };
      im.src = IMG_SRC[k];
      IMG[k] = im;
    });
  }
  function blit(img, x, y, w, foot) {
    if (!img || !img.naturalWidth) return false;
    const h = w * (img.naturalHeight / img.naturalWidth);
    ctx.drawImage(img, x - w / 2, y - h + (foot || 0), w, h);
    return true;
  }

  let dpr = 1, cssW = 0, cssH = 0;
  let camYaw = 0, camZoom = 1;
  const ZMIN = 0.85, ZMAX = 2.15;
  function clampZ(z) { return Math.max(ZMIN, Math.min(ZMAX, z)); }

  const state = {
    gold: 50, lives: 10, wave: 0, phase: "countdown", countdown: 5,
    selected: null, hover: null, towers: [], creeps: [], fx: [], floats: [],
    occupied: new Set(), spawned: 0, spawnTimer: 0, leakFlash: 0
  };

  function reset() {
    Object.assign(state, {
      gold: 50, lives: 10, wave: 0, phase: "countdown", countdown: 5,
      selected: null, hover: null, towers: [], creeps: [], fx: [], floats: [],
      occupied: new Set(), spawned: 0, spawnTimer: 0, leakFlash: 0
    });
    overlay.classList.remove("show", "win", "lose");
    hud();
  }

  function key(c, r) { return c + "," + r; }
  function padAt(c, r) { return PADS.find(p => p.c === c && p.r === r) || null; }
  function creepGrid(cr) {
    const maxP = PATH_LEN - 1;
    const p = Math.max(0, Math.min(cr.progress, maxP));
    const i = Math.min(Math.floor(p), maxP - 1);
    const f = p - i;
    const a = PATH[i], b = PATH[Math.min(i + 1, maxP)];
    return { x: a[0] + (b[0] - a[0]) * f, y: a[1] + (b[1] - a[1]) * f };
  }
  function pathUV(progress) {
    const maxP = PATH_LEN - 1;
    const p = Math.max(0, Math.min(progress, maxP));
    const i = Math.min(Math.floor(p), maxP - 1);
    const f = p - i;
    const a = PATH_UV[i], b = PATH_UV[Math.min(i + 1, maxP)];
    return { u: a[0] + (b[0] - a[0]) * f, v: a[1] + (b[1] - a[1]) * f };
  }

  function layout() {
    const img = IMG.map;
    const iw = (img && img.naturalWidth) || 1536;
    const ih = (img && img.naturalHeight) || 1024;
    const fit = Math.min(cssW / iw, cssH / ih) * 1.18;
    return { cx: cssW * 0.5, cy: cssH * 0.52, sc: fit * camZoom, iw, ih };
  }
  function uvToScreen(u, v) {
    const L = layout();
    const x = (u - 0.5) * L.iw * L.sc;
    const y = (v - 0.5) * L.ih * L.sc;
    const cs = Math.cos(camYaw), sn = Math.sin(camYaw);
    return { x: L.cx + x * cs - y * sn, y: L.cy + x * sn + y * cs };
  }
  function tilePx() {
    let s = 0;
    for (let i = 1; i < PATH_LEN; i++) {
      const a = uvToScreen(PATH_UV[i - 1][0], PATH_UV[i - 1][1]);
      const b = uvToScreen(PATH_UV[i][0], PATH_UV[i][1]);
      s += Math.hypot(a.x - b.x, a.y - b.y);
    }
    return s / (PATH_LEN - 1);
  }
  function padAtCss(x, y) {
    let best = null, bestD = 1e9;
    const lim = tilePx() * 1.15;
    for (const p of PADS) {
      const s = uvToScreen(p.u, p.v);
      const d = Math.hypot(x - s.x, y - s.y);
      if (d < lim && d < bestD) { bestD = d; best = p; }
    }
    return best;
  }

  function spawnCreep() {
    const w = WAVES[state.wave];
    state.creeps.push({ progress: 0, hp: w.hp, maxHp: w.hp, slowT: 0, gold: w.gold, big: state.wave === 9 });
  }
  function killCreep(cr, idx) {
    state.gold += cr.gold;
    const uv = pathUV(cr.progress);
    state.floats.push({ u: uv.u, v: uv.v, t: 0, text: "+" + cr.gold });
    state.creeps.splice(idx, 1);
  }
  function leakCreep(idx) {
    state.creeps.splice(idx, 1);
    if (state.phase === "win" || state.phase === "lose") return;
    state.lives -= 1;
    state.leakFlash = 0.35;
    if (state.lives <= 0) { state.lives = 0; lose(); }
  }
  function endWaveCheck() {
    if (state.phase !== "combat") return;
    if (state.spawned < WAVES[state.wave].count) return;
    if (state.creeps.length > 0) return;
    if (state.wave >= 9) win();
    else { state.wave += 1; state.phase = "countdown"; state.countdown = 5; state.spawned = 0; }
  }
  function win() {
    state.phase = "win";
    overlay.classList.add("show", "win"); overlay.classList.remove("lose");
    document.getElementById("ov-title").textContent = "胜利";
    document.getElementById("ov-sub").textContent = "窄路守住了 · 十波尽灭";
  }
  function lose() {
    state.phase = "lose";
    overlay.classList.add("show", "lose"); overlay.classList.remove("win");
    document.getElementById("ov-title").textContent = "失败";
    document.getElementById("ov-sub").textContent = "有怪物漏出了出口";
  }
  function dist(ax, ay, bx, by) { return Math.hypot(ax - bx, ay - by); }

  function fireTower(tw, dt) {
    const def = TOWER_DEF[tw.type];
    tw.cd -= dt;
    if (tw.cd > 0) return;
    let best = null, bestProg = -1;
    for (const cr of state.creeps) {
      const p = creepGrid(cr);
      if (dist(p.x, p.y, tw.c, tw.r) <= def.range + 1e-6 && cr.progress > bestProg) {
        bestProg = cr.progress; best = cr;
      }
    }
    if (!best) return;
    tw.cd = 1 / def.rate;
    const tp = pathUV(best.progress);
    const tu = padAt(tw.c, tw.r);
    state.fx.push({
      kind: "shot",
      u0: tu ? tu.u : tp.u, v0: tu ? tu.v : tp.v,
      u1: tp.u, v1: tp.v, t: 0, life: 0.12, type: tw.type
    });
    const g = creepGrid(best);
    const targets = [];
    if (def.splash > 0) {
      state.fx.push({ kind: "splash", u: tp.u, v: tp.v, t: 0, life: 0.28 });
      for (const cr of state.creeps) {
        const p = creepGrid(cr);
        if (dist(p.x, p.y, g.x, g.y) <= def.splash + 1e-6) targets.push(cr);
      }
    } else targets.push(best);
    for (const cr of targets) {
      cr.hp -= def.dmg;
      if (def.slow > 0) cr.slowT = 1.5;
    }
    for (let i = state.creeps.length - 1; i >= 0; i--) {
      if (state.creeps[i].hp <= 0) killCreep(state.creeps[i], i);
    }
  }

  function update(dt) {
    if (state.phase === "win" || state.phase === "lose") {
      for (const f of state.fx) f.t += dt;
      state.fx = state.fx.filter(f => f.t < f.life);
      for (const f of state.floats) f.t += dt;
      state.floats = state.floats.filter(f => f.t < 0.7);
      return;
    }
    state.leakFlash = Math.max(0, state.leakFlash - dt);
    if (state.phase === "countdown") {
      state.countdown -= dt;
      if (state.countdown <= 0) {
        state.countdown = 0; state.phase = "combat"; state.spawned = 0; state.spawnTimer = 0;
      }
    }
    if (state.phase === "combat") {
      const w = WAVES[state.wave];
      state.spawnTimer -= dt;
      while (state.spawned < w.count && state.spawnTimer <= 0) {
        spawnCreep(); state.spawned += 1; state.spawnTimer += w.interval;
      }
      for (const cr of state.creeps) {
        cr.slowT = Math.max(0, cr.slowT - dt);
        cr.progress += (cr.slowT > 0 ? 0.6 : 1) * dt;
      }
      for (let i = state.creeps.length - 1; i >= 0; i--) {
        if (state.creeps[i].progress >= PATH_LEN - 1) leakCreep(i);
      }
      for (const tw of state.towers) fireTower(tw, dt);
      endWaveCheck();
    }
    for (const f of state.fx) f.t += dt;
    state.fx = state.fx.filter(f => f.t < f.life);
    for (const f of state.floats) f.t += dt;
    state.floats = state.floats.filter(f => f.t < 0.7);
  }

  function hud() {
    document.getElementById("gold").textContent = String(state.gold);
    document.getElementById("lives").textContent = String(state.lives);
    document.getElementById("wave").textContent = (state.wave + 1) + "/10";
    const next = document.getElementById("next");
    if (state.phase === "countdown") next.textContent = state.countdown.toFixed(1);
    else if (state.phase === "combat") next.textContent = "战斗中";
    else next.textContent = state.phase === "win" ? "完成" : "—";
    document.querySelector(".stat.life").style.background = state.leakFlash > 0 ? "rgba(90,30,24,0.7)" : "";
    for (const type of ["arrow", "ice", "cannon"]) {
      const el = document.getElementById("card-" + type);
      const aff = state.gold >= TOWER_DEF[type].cost && state.phase !== "win" && state.phase !== "lose";
      el.classList.toggle("disabled", !aff);
      el.classList.toggle("selected", state.selected === type);
    }
  }

  function tryPlace(pad) {
    if (!pad || state.phase === "win" || state.phase === "lose") return;
    if (!state.selected) return;
    if (state.occupied.has(key(pad.c, pad.r))) return;
    const def = TOWER_DEF[state.selected];
    if (state.gold < def.cost) return;
    state.gold -= def.cost;
    state.towers.push({ c: pad.c, r: pad.r, u: pad.u, v: pad.v, type: state.selected, cd: 0 });
    state.occupied.add(key(pad.c, pad.r));
    state.fx.push({ kind: "place", u: pad.u, v: pad.v, t: 0, life: 0.4 });
    hud();
  }

  function resize() {
    const rect = stage.getBoundingClientRect();
    cssW = rect.width; cssH = rect.height;
    dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    canvas.width = Math.max(1, Math.floor(cssW * dpr));
    canvas.height = Math.max(1, Math.floor(cssH * dpr));
    canvas.style.width = cssW + "px";
    canvas.style.height = cssH + "px";
  }

  function drawHouse(u, v, type, ghost) {
    const p = uvToScreen(u, v);
    const w = tilePx() * 2.15;
    ctx.save();
    if (ghost) ctx.globalAlpha = 0.55;
    const timg = type === "ice" ? IMG.ice : type === "cannon" ? IMG.cannon : IMG.arrow;
    blit(timg, p.x, p.y + 4, w * (type === "cannon" ? 1.05 : 0.95), 0);
    ctx.restore();
  }

  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = "#2d3d22";
    ctx.fillRect(0, 0, cssW, cssH);

    const L = layout();
    if (IMG.map && IMG.map.naturalWidth) {
      ctx.save();
      ctx.translate(L.cx, L.cy);
      ctx.rotate(camYaw);
      ctx.scale(L.sc, L.sc);
      ctx.drawImage(IMG.map, -L.iw / 2, -L.ih / 2, L.iw, L.ih);
      ctx.restore();
    }

    const tp = tilePx();
    const extras = PADS.filter(p => !p.painted).sort((a, b) => a.v - b.v);
    for (const p of extras) {
      const s = uvToScreen(p.u, p.v);
      if (!blit(IMG.pad, s.x, s.y + tp * 0.15, tp * 1.55, 0)) {
        ctx.fillStyle = "#8a8680";
        ctx.beginPath(); ctx.ellipse(s.x, s.y, tp * 0.55, tp * 0.32, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#c5c2bb";
        ctx.beginPath(); ctx.ellipse(s.x, s.y, tp * 0.32, tp * 0.18, 0, 0, Math.PI * 2); ctx.fill();
      }
    }
    const s0 = uvToScreen(PATH_UV[0][0], PATH_UV[0][1]);
    const s1 = uvToScreen(PATH_UV[PATH_LEN - 1][0], PATH_UV[PATH_LEN - 1][1]);
    ctx.font = "700 11px sans-serif"; ctx.textAlign = "center";
    ctx.fillStyle = "#2f6b3c"; ctx.fillText("入口", s0.x, s0.y - 14);
    ctx.fillStyle = "#7a3232"; ctx.fillText("出口", s1.x, s1.y + 16);

    if (state.selected) {
      for (const p of PADS) {
        if (state.occupied.has(key(p.c, p.r))) continue;
        const s = uvToScreen(p.u, p.v);
        ctx.beginPath();
        ctx.ellipse(s.x, s.y, tp * 0.72, tp * 0.42, 0, 0, Math.PI * 2);
        ctx.strokeStyle = "rgba(230,195,92,0.55)";
        ctx.lineWidth = 2; ctx.stroke();
      }
    }

    if (state.selected && state.hover) {
      const p = state.hover;
      const valid = !state.occupied.has(key(p.c, p.r));
      const s = uvToScreen(p.u, p.v);
      ctx.beginPath();
      ctx.ellipse(s.x, s.y, TOWER_DEF[state.selected].range * tp,
                  TOWER_DEF[state.selected].range * tp * 0.55, 0, 0, Math.PI * 2);
      ctx.strokeStyle = valid ? "rgba(230,195,92,0.85)" : "rgba(200,80,70,0.6)";
      ctx.lineWidth = 2; ctx.stroke();
      if (valid) drawHouse(p.u, p.v, state.selected, true);
    }

    const towersSorted = state.towers.slice().sort((a, b) => a.v - b.v);
    for (const tw of towersSorted) drawHouse(tw.u, tw.v, tw.type, false);

    for (const f of state.fx) {
      const a = 1 - f.t / f.life;
      if (f.kind === "shot") {
        const p0 = uvToScreen(f.u0, f.v0), p1 = uvToScreen(f.u1, f.v1);
        ctx.strokeStyle = f.type === "ice" ? `rgba(140,220,240,${a})` :
                          f.type === "cannon" ? `rgba(230,140,70,${a})` : `rgba(230,210,150,${a})`;
        ctx.lineWidth = f.type === "cannon" ? 3.5 : 2;
        ctx.beginPath(); ctx.moveTo(p0.x, p0.y - tp * 0.8); ctx.lineTo(p1.x, p1.y); ctx.stroke();
      } else if (f.kind === "splash") {
        const p = uvToScreen(f.u, f.v);
        ctx.globalAlpha = a;
        if (!blit(IMG.splash, p.x, p.y + 4, tp * (1.4 + f.t * 2.2), 0)) {
          ctx.beginPath(); ctx.ellipse(p.x, p.y, tp * (0.4 + f.t * 2), tp * (0.22 + f.t), 0, 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(255,120,30,${a * 0.9})`; ctx.lineWidth = 3; ctx.stroke();
        }
        ctx.globalAlpha = 1;
      } else if (f.kind === "place") {
        const p = uvToScreen(f.u, f.v);
        ctx.globalAlpha = a;
        if (!blit(IMG.place, p.x, p.y + 4, tp * (1.3 + f.t * 1.2), 0)) {
          ctx.beginPath(); ctx.ellipse(p.x, p.y, tp * (0.3 + f.t), tp * (0.16 + f.t * 0.5), 0, 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(255,210,70,${a})`; ctx.lineWidth = 3; ctx.stroke();
        }
        ctx.globalAlpha = 1;
      }
    }

    const creepsSorted = state.creeps.slice().sort((a, b) => pathUV(a.progress).v - pathUV(b.progress).v);
    for (const cr of creepsSorted) {
      const uv = pathUV(cr.progress);
      const p = uvToScreen(uv.u, uv.v);
      const rad = tp * (cr.big ? 0.38 : 0.28);
      if (cr.slowT > 0) {
        ctx.globalAlpha = 0.85;
        if (!blit(IMG.slow, p.x, p.y + rad * 0.4, tp * 1.05, 0)) {
          ctx.fillStyle = "rgba(80,180,220,0.35)";
          ctx.beginPath(); ctx.ellipse(p.x, p.y + 4, rad * 1.6, rad * 0.7, 0, 0, Math.PI * 2); ctx.fill();
        }
        ctx.globalAlpha = 1;
      }
      ctx.fillStyle = cr.slowT > 0 ? "#3a6a7c" : "#1e1a24";
      ctx.beginPath(); ctx.ellipse(p.x, p.y, rad * 0.85, rad * 1.15, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = cr.slowT > 0 ? "#6ec7e0" : "#2c2733";
      ctx.beginPath(); ctx.ellipse(p.x, p.y - rad * 0.7, rad * 0.55, rad * 0.5, 0, 0, Math.PI * 2); ctx.fill();
      const bw = tp * 0.7, bh = 3;
      ctx.fillStyle = "rgba(0,0,0,0.5)";
      ctx.fillRect(p.x - bw / 2, p.y - rad * 1.6, bw, bh);
      ctx.fillStyle = cr.hp / cr.maxHp > 0.4 ? "#7dcf6a" : "#d45a4a";
      ctx.fillRect(p.x - bw / 2, p.y - rad * 1.6, bw * Math.max(0, cr.hp / cr.maxHp), bh);
    }

    for (const f of state.floats) {
      const p = uvToScreen(f.u, f.v);
      ctx.globalAlpha = 1 - f.t / 0.7;
      ctx.fillStyle = "#e6c35c";
      ctx.font = "bold 13px sans-serif"; ctx.textAlign = "center";
      ctx.fillText(f.text, p.x, p.y - f.t * 28);
      ctx.globalAlpha = 1;
    }

    if (state.phase === "countdown") {
      ctx.fillStyle = "rgba(20,28,14,0.4)";
      ctx.fillRect(cssW / 2 - 50, 12, 100, 36);
      ctx.fillStyle = "#f0d48a";
      ctx.font = "800 22px sans-serif"; ctx.textAlign = "center";
      ctx.fillText(Math.ceil(state.countdown) + " 秒", cssW / 2, 36);
    }
  }

  document.querySelectorAll(".card").forEach(btn => {
    btn.addEventListener("click", () => {
      const type = btn.dataset.type;
      if (state.gold < TOWER_DEF[type].cost) return;
      state.selected = state.selected === type ? null : type;
      hud();
    });
  });
  document.getElementById("restart").addEventListener("click", reset);
  function ptrToPad(ev) {
    const rect = canvas.getBoundingClientRect();
    return padAtCss(ev.clientX - rect.left, ev.clientY - rect.top);
  }
  const pointers = new Map();
  let drag = null, didOrbit = false, pinch0 = 0, pinchZ = 1;
  function pt(ev) {
    const rect = canvas.getBoundingClientRect();
    return { x: ev.clientX - rect.left, y: ev.clientY - rect.top };
  }
  canvas.addEventListener("pointerdown", ev => {
    ev.preventDefault();
    try { canvas.setPointerCapture(ev.pointerId); } catch (_) {}
    const p = pt(ev);
    pointers.set(ev.pointerId, p);
    state.hover = padAtCss(p.x, p.y);
    if (pointers.size === 1) {
      drag = { x: p.x, y: p.y, yaw: camYaw };
      didOrbit = false;
    } else if (pointers.size === 2) {
      const a = [...pointers.values()];
      pinch0 = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y) || 1;
      pinchZ = camZoom;
      drag = null;
    }
  });
  canvas.addEventListener("pointermove", ev => {
    if (!pointers.has(ev.pointerId) && pointers.size === 0) {
      state.hover = ptrToPad(ev);
      return;
    }
    pointers.set(ev.pointerId, pt(ev));
    if (pointers.size >= 2) {
      const a = [...pointers.values()];
      const d = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y) || 1;
      camZoom = clampZ(pinchZ * (d / pinch0));
      didOrbit = true;
      return;
    }
    if (drag) {
      const p = pt(ev);
      const dx = p.x - drag.x, dy = p.y - drag.y;
      if (Math.abs(dx) + Math.abs(dy) > 7) didOrbit = true;
      camYaw = drag.yaw + dx * 0.01;
      state.hover = padAtCss(p.x, p.y);
    }
  });
  canvas.addEventListener("pointerup", ev => {
    const t = ptrToPad(ev);
    state.hover = t;
    pointers.delete(ev.pointerId);
    if (pointers.size === 0) {
      if (!didOrbit && t) tryPlace(t);
      drag = null;
      didOrbit = false;
    }
  });
  canvas.addEventListener("pointercancel", ev => { pointers.delete(ev.pointerId); drag = null; });
  canvas.addEventListener("pointerleave", () => { if (pointers.size === 0) state.hover = null; });
  canvas.addEventListener("wheel", ev => {
    ev.preventDefault();
    camZoom = clampZ(camZoom * (ev.deltaY > 0 ? 0.9 : 1.12));
  }, { passive: false });
  canvas.addEventListener("contextmenu", ev => ev.preventDefault());
  window.addEventListener("resize", resize);
  new ResizeObserver(resize).observe(stage);
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now; update(dt); hud(); draw(); requestAnimationFrame(loop);
  }
  loadImages(() => { resize(); reset(); requestAnimationFrame(loop); });
})();
</script>
</body>
</html>
