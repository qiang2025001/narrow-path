<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>窄路</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%;
    background: #6a8a4e;
    color: #f4f1ea;
    font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", "Heiti SC", sans-serif;
    user-select: none; overflow: hidden;
  }
  body { display: flex; justify-content: center; }
  #app {
    width: 100%; max-width: 430px; height: 100%; height: 100dvh;
    display: flex; flex-direction: column; position: relative; overflow: hidden;
    background: #6a8a4e;
  }
  header {
    flex: 0 0 auto;
    padding: 6px 10px 4px;
    padding-top: max(6px, env(safe-area-inset-top));
    background: rgba(20,28,14,0.35);
  }
  .hud { display: grid; grid-template-columns: 1fr 1fr 1fr 1.1fr; gap: 5px; }
  .stat {
    background: rgba(18,24,12,0.45); border-radius: 8px; padding: 5px 7px;
    min-height: 38px;
  }
  .stat .k { font-size: 10px; color: #dce6d0; opacity: 0.8; }
  .stat .v { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat.gold .v { color: #e6c35c; }
  .stat.life .v { color: #e07070; }
  #stage { flex: 1 1 auto; min-height: 0; position: relative; }
  canvas { display: block; touch-action: none; width: 100%; height: 100%; }
  footer {
    flex: 0 0 auto;
    padding: 6px 8px max(8px, env(safe-area-inset-bottom));
    background: rgba(20,28,14,0.35);
  }
  .bar { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .card {
    appearance: none; font-family: inherit; min-height: 58px; border-radius: 10px;
    border: 2px solid rgba(255,255,255,0.18); background: rgba(24,32,16,0.55);
    color: #f4f1ea; display: flex; flex-direction: column; align-items: center;
    justify-content: center; cursor: pointer; padding: 4px;
  }
  .card.selected { border-color: #e6c35c; background: rgba(50,64,28,0.75); }
  .card.disabled { opacity: 0.4; }
  .card .name { font-size: 14px; font-weight: 700; }
  .card .cost { font-size: 12px; color: #e6c35c; }
  .overlay {
    position: absolute; inset: 0; background: rgba(8,12,6,0.62);
    display: none; align-items: center; justify-content: center;
    flex-direction: column; gap: 10px; z-index: 5; text-align: center;
  }
  .overlay.show { display: flex; }
  .overlay h2 { margin: 0; font-size: 32px; letter-spacing: 0.18em; }
  #restart {
    min-height: 44px; min-width: 160px; border: 0; border-radius: 12px;
    background: #7cb36a; color: #142010; font-size: 16px; font-weight: 800;
    font-family: inherit; cursor: pointer;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="hud">
      <div class="stat gold"><div class="k">金</div><div class="v" id="gold">50</div></div>
      <div class="stat life"><div class="k">命</div><div class="v" id="lives">10</div></div>
      <div class="stat"><div class="k">波</div><div class="v" id="wave">1/10</div></div>
      <div class="stat"><div class="k">下一波</div><div class="v" id="next">5.0</div></div>
    </div>
  </header>
  <div id="stage"><canvas id="cv"></canvas></div>
  <footer>
    <div class="bar">
      <button type="button" class="card" data-type="arrow" id="card-arrow"><div class="name">箭</div><div class="cost">50</div></button>
      <button type="button" class="card" data-type="ice" id="card-ice"><div class="name">冰</div><div class="cost">70</div></button>
      <button type="button" class="card" data-type="cannon" id="card-cannon"><div class="name">炮</div><div class="cost">120</div></button>
    </div>
  </footer>
  <div class="overlay" id="overlay">
    <h2 id="ov-title">胜利</h2>
    <p id="ov-sub"></p>
    <button type="button" id="restart">重新开始</button>
  </div>
</div>
<script>
(() => {
  const COLS = 7, ROWS = 13;
  const PATH = [
    [1,0],[1,1],[1,2],[2,2],[3,2],[4,2],
    [4,3],[4,4],[4,5],[3,5],[2,5],[1,5],
    [1,6],[1,7],[1,8],[2,8],[3,8],[4,8],
    [4,9],[4,10],[4,11],[5,11],[6,11]
  ];
  const PATH_SET = new Set(PATH.map(([c,r]) => c + "," + r));
  const PATH_LEN = PATH.length;
  const TOWER_DEF = {
    arrow:  { name: "箭", cost: 50,  dmg: 8,  rate: 1.0, range: 2.5, splash: 0, slow: 0,   color: "#d8c49a" },
    ice:    { name: "冰", cost: 70,  dmg: 3,  rate: 0.8, range: 2.0, splash: 0, slow: 0.4, color: "#6ec7e0" },
    cannon: { name: "炮", cost: 120, dmg: 22, rate: 0.45,range: 2.0, splash: 1, slow: 0,   color: "#9a9590" }
  };
  const WAVES = [
    { count: 6,  hp: 10, gold: 8,  interval: 1.2 },
    { count: 8,  hp: 14, gold: 8,  interval: 1.1 },
    { count: 8,  hp: 20, gold: 9,  interval: 1.0 },
    { count: 10, hp: 26, gold: 9,  interval: 1.0 },
    { count: 10, hp: 34, gold: 10, interval: 0.9 },
    { count: 12, hp: 42, gold: 10, interval: 0.9 },
    { count: 12, hp: 54, gold: 11, interval: 0.8 },
    { count: 14, hp: 68, gold: 11, interval: 0.8 },
    { count: 14, hp: 84, gold: 12, interval: 0.75 },
    { count: 16, hp: 100,gold: 12, interval: 0.7 }
  ];

  const canvas = document.getElementById("cv");
  const ctx = canvas.getContext("2d");
  const stage = document.getElementById("stage");
  const overlay = document.getElementById("overlay");
  const IMG = {};
  const IMG_SRC = {
    grass: "assets/tile-grass.png",
    path: "assets/tile-path.png",
    pad: "assets/tile-pad.png",
    arrow: "assets/tower-arrow.png",
    ice: "assets/tower-ice.png",
    cannon: "assets/tower-cannon.png",
    place: "assets/fx-place.png",
    splash: "assets/fx-splash.png",
    slow: "assets/fx-ice.png",
    bolt: "assets/fx-bolt.png",
    treeRound: "assets/tree-round.png",
    treePine: "assets/tree-pine.png"
  };
  function loadImages(done) {
    const keys = Object.keys(IMG_SRC);
    let n = 0;
    keys.forEach(k => {
      const im = new Image();
      im.onload = im.onerror = () => { n++; if (n >= keys.length) done(); };
      im.src = IMG_SRC[k];
      IMG[k] = im;
    });
  }
  function blit(img, x, y, w, foot) {
    if (!img || !img.naturalWidth) return false;
    const h = w * (img.naturalHeight / img.naturalWidth);
    ctx.drawImage(img, x - w / 2, y - h + (foot || 0), w, h);
    return true;
  }

  let dpr = 1, cssW = 0, cssH = 0, TW = 52, TH = 26, originX = 0, originY = 0;
  const GH = 16, PH = 5; // grass / path extrusion

  const TREES = [];
  (function seedTrees() {
    const spots = [
      [-0.7, 0.2, 1], [ -0.85, 3, 0], [-0.6, 6.2, 1], [-0.9, 9.5, 0], [-0.55, 12.2, 1],
      [6.7, 0.4, 0], [6.85, 2.8, 1], [6.6, 5.5, 0], [6.9, 8.2, 1], [6.55, 11.4, 0],
      [0.2, -0.7, 1], [2.5, -0.75, 0], [4.8, -0.65, 1],
      [1.2, 12.7, 0], [3.6, 12.75, 1], [5.4, 12.65, 0]
    ];
    for (const [c,r,k] of spots) TREES.push({ c, r, round: k === 1, s: 0.85 + ((c*13+r*7)%5)*0.06 });
  })();

  const state = {
    gold: 50, lives: 10, wave: 0, phase: "countdown", countdown: 5,
    selected: null, hover: null, towers: [], creeps: [], fx: [], floats: [],
    occupied: new Set(), spawned: 0, spawnTimer: 0, leakFlash: 0
  };

  function reset() {
    Object.assign(state, {
      gold: 50, lives: 10, wave: 0, phase: "countdown", countdown: 5,
      selected: null, hover: null, towers: [], creeps: [], fx: [], floats: [],
      occupied: new Set(), spawned: 0, spawnTimer: 0, leakFlash: 0
    });
    overlay.classList.remove("show", "win", "lose");
    hud();
  }

  function key(c, r) { return c + "," + r; }
  function isPath(c, r) { return PATH_SET.has(key(c, r)); }
  function inGrid(c, r) { return c >= 0 && r >= 0 && c < COLS && r < ROWS; }
  function besidePath(c, r) {
    if (isPath(c, r)) return false;
    return [[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy]) => isPath(c+dx, r+dy));
  }

  function creepPos(cr) {
    const maxP = PATH_LEN - 1;
    const p = Math.max(0, Math.min(cr.progress, maxP));
    const i = Math.min(Math.floor(p), maxP - 1);
    const f = p - i;
    const a = PATH[i], b = PATH[Math.min(i + 1, maxP)];
    return { x: a[0] + (b[0] - a[0]) * f, y: a[1] + (b[1] - a[1]) * f };
  }

  function iso(c, r, h) {
    return {
      x: originX + (c - r) * (TW / 2),
      y: originY + (c + r) * (TH / 2) - (h || 0)
    };
  }

  function diamond(c, r, h) {
    const p = iso(c, r, h);
    return [
      { x: p.x, y: p.y - TH / 2 },
      { x: p.x + TW / 2, y: p.y },
      { x: p.x, y: p.y + TH / 2 },
      { x: p.x - TW / 2, y: p.y }
    ];
  }

  function fillPoly(pts, fill) {
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.closePath();
    ctx.fillStyle = fill;
    ctx.fill();
  }

  function drawPrism(c, r, h, top, left, right) {
    const img = isPath(c, r) ? IMG.path : IMG.grass;
    const p = iso(c, r, 0);
    if (blit(img, p.x, p.y + TH * 0.55, TW * 1.28, 0)) return;
    const topPts = diamond(c, r, h);
    const bot = diamond(c, r, 0);
    fillPoly([topPts[3], topPts[2], bot[2], bot[3]], left);
    fillPoly([topPts[1], topPts[2], bot[2], bot[1]], right);
    fillPoly(topPts, top);
  }

  function spawnCreep() {
    const w = WAVES[state.wave];
    state.creeps.push({ progress: 0, hp: w.hp, maxHp: w.hp, slowT: 0, gold: w.gold, big: state.wave === 9 });
  }
  function killCreep(cr, idx) {
    state.gold += cr.gold;
    const p = creepPos(cr);
    state.floats.push({ x: p.x, y: p.y, t: 0, text: "+" + cr.gold });
    state.creeps.splice(idx, 1);
  }
  function leakCreep(idx) {
    state.creeps.splice(idx, 1);
    if (state.phase === "win" || state.phase === "lose") return;
    state.lives -= 1;
    state.leakFlash = 0.35;
    if (state.lives <= 0) { state.lives = 0; lose(); }
  }
  function endWaveCheck() {
    if (state.phase !== "combat") return;
    if (state.spawned < WAVES[state.wave].count) return;
    if (state.creeps.length > 0) return;
    if (state.wave >= 9) win();
    else { state.wave += 1; state.phase = "countdown"; state.countdown = 5; state.spawned = 0; }
  }
  function win() {
    state.phase = "win";
    overlay.classList.add("show", "win"); overlay.classList.remove("lose");
    document.getElementById("ov-title").textContent = "胜利";
    document.getElementById("ov-sub").textContent = "窄路守住了 · 十波尽灭";
  }
  function lose() {
    state.phase = "lose";
    overlay.classList.add("show", "lose"); overlay.classList.remove("win");
    document.getElementById("ov-title").textContent = "失败";
    document.getElementById("ov-sub").textContent = "有怪物漏出了出口";
  }
  function dist(ax, ay, bx, by) { return Math.hypot(ax - bx, ay - by); }

  function fireTower(tw, dt) {
    const def = TOWER_DEF[tw.type];
    tw.cd -= dt;
    if (tw.cd > 0) return;
    let best = null, bestProg = -1;
    for (const cr of state.creeps) {
      const p = creepPos(cr);
      if (dist(p.x, p.y, tw.c, tw.r) <= def.range + 1e-6 && cr.progress > bestProg) {
        bestProg = cr.progress; best = cr;
      }
    }
    if (!best) return;
    tw.cd = 1 / def.rate;
    const tp = creepPos(best);
    state.fx.push({ kind: "shot", x0: tw.c, y0: tw.r, x1: tp.x, y1: tp.y, t: 0, life: 0.12, type: tw.type });
    const targets = [];
    if (def.splash > 0) {
      state.fx.push({ kind: "splash", x: tp.x, y: tp.y, t: 0, life: 0.28 });
      for (const cr of state.creeps) {
        const p = creepPos(cr);
        if (dist(p.x, p.y, tp.x, tp.y) <= def.splash + 1e-6) targets.push(cr);
      }
    } else targets.push(best);
    for (const cr of targets) {
      cr.hp -= def.dmg;
      if (def.slow > 0) cr.slowT = 1.5;
    }
    for (let i = state.creeps.length - 1; i >= 0; i--) {
      if (state.creeps[i].hp <= 0) killCreep(state.creeps[i], i);
    }
  }

  function update(dt) {
    if (state.phase === "win" || state.phase === "lose") {
      for (const f of state.fx) f.t += dt;
      state.fx = state.fx.filter(f => f.t < f.life);
      for (const f of state.floats) f.t += dt;
      state.floats = state.floats.filter(f => f.t < 0.7);
      return;
    }
    state.leakFlash = Math.max(0, state.leakFlash - dt);
    if (state.phase === "countdown") {
      state.countdown -= dt;
      if (state.countdown <= 0) {
        state.countdown = 0; state.phase = "combat"; state.spawned = 0; state.spawnTimer = 0;
      }
    }
    if (state.phase === "combat") {
      const w = WAVES[state.wave];
      state.spawnTimer -= dt;
      while (state.spawned < w.count && state.spawnTimer <= 0) {
        spawnCreep(); state.spawned += 1; state.spawnTimer += w.interval;
      }
      for (const cr of state.creeps) {
        cr.slowT = Math.max(0, cr.slowT - dt);
        cr.progress += (cr.slowT > 0 ? 0.6 : 1) * dt;
      }
      for (let i = state.creeps.length - 1; i >= 0; i--) {
        if (state.creeps[i].progress >= PATH_LEN - 1) leakCreep(i);
      }
      for (const tw of state.towers) fireTower(tw, dt);
      endWaveCheck();
    }
    for (const f of state.fx) f.t += dt;
    state.fx = state.fx.filter(f => f.t < f.life);
    for (const f of state.floats) f.t += dt;
    state.floats = state.floats.filter(f => f.t < 0.7);
  }

  function hud() {
    document.getElementById("gold").textContent = String(state.gold);
    document.getElementById("lives").textContent = String(state.lives);
    document.getElementById("wave").textContent = (state.wave + 1) + "/10";
    const next = document.getElementById("next");
    if (state.phase === "countdown") next.textContent = state.countdown.toFixed(1);
    else if (state.phase === "combat") next.textContent = "战斗中";
    else next.textContent = state.phase === "win" ? "完成" : "—";
    document.querySelector(".stat.life").style.background = state.leakFlash > 0 ? "rgba(90,30,24,0.7)" : "";
    for (const type of ["arrow", "ice", "cannon"]) {
      const el = document.getElementById("card-" + type);
      const aff = state.gold >= TOWER_DEF[type].cost && state.phase !== "win" && state.phase !== "lose";
      el.classList.toggle("disabled", !aff);
      el.classList.toggle("selected", state.selected === type);
    }
  }

  function tileH(c, r) { return isPath(c, r) ? PH : GH; }

  function tileAtCss(x, y) {
    let best = null, bestD = 1e9;
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const p = iso(c, r, tileH(c, r));
        const dx = (x - p.x) / (TW / 2);
        const dy = (y - p.y) / (TH / 2);
        const d = Math.abs(dx) + Math.abs(dy);
        if (d <= 1.12 && d < bestD) { bestD = d; best = { c, r }; }
      }
    }
    return best;
  }

  function tryPlace(c, r) {
    if (state.phase === "win" || state.phase === "lose") return;
    if (!state.selected) return;
    if (!inGrid(c, r) || isPath(c, r)) return;
    if (state.occupied.has(key(c, r))) return;
    const def = TOWER_DEF[state.selected];
    if (state.gold < def.cost) return;
    state.gold -= def.cost;
    state.towers.push({ c, r, type: state.selected, cd: 0 });
    state.occupied.add(key(c, r));
    state.fx.push({ kind: "place", x: c, y: r, t: 0, life: 0.4 });
    hud();
  }

  function resize() {
    const rect = stage.getBoundingClientRect();
    cssW = rect.width; cssH = rect.height;
    dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    canvas.width = Math.max(1, Math.floor(cssW * dpr));
    canvas.height = Math.max(1, Math.floor(cssH * dpr));
    canvas.style.width = cssW + "px";
    canvas.style.height = cssH + "px";
    const spanX = (COLS + ROWS) * 0.5;
    const spanY = (COLS + ROWS) * 0.5;
    TW = Math.min(cssW / (spanX + 1.6), cssH / ((spanY * 0.5) + 3.2) * 2);
    TW = Math.max(28, Math.min(64, TW));
    TH = TW * 0.5;
    originX = cssW / 2;
    originY = cssH * 0.18 + TH;
  }

  function drawTree(t) {
    const p = iso(t.c, t.r, GH);
    const img = t.round ? IMG.treeRound : IMG.treePine;
    const w = TW * (t.round ? 0.95 : 0.72) * t.s;
    if (blit(img, p.x, p.y + TH * 0.05, w, 0)) return;
    const s = TW * 0.22 * t.s;
    ctx.fillStyle = "#5a3a22";
    ctx.fillRect(p.x - s * 0.12, p.y - s * 0.15, s * 0.24, s * 0.55);
  }

  function drawPad(c, r) {
    const p = iso(c, r, GH);
    if (blit(IMG.pad, p.x, p.y + TH * 0.2, TW * 0.95, 0)) return;
    ctx.fillStyle = "#8a8680";
    ctx.beginPath(); ctx.ellipse(p.x, p.y, TW * 0.22, TH * 0.22, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#c5c2bb";
    ctx.beginPath(); ctx.ellipse(p.x, p.y, TW * 0.13, TH * 0.13, 0, 0, Math.PI * 2); ctx.fill();
  }

  function drawHouse(c, r, type, ghost) {
    const base = iso(c, r, GH + 2);
    ctx.save();
    if (ghost) ctx.globalAlpha = 0.55;
    const timg = type === "ice" ? IMG.ice : type === "cannon" ? IMG.cannon : IMG.arrow;
    if (blit(timg, base.x, base.y + TH * 0.05, TW * (type === "cannon" ? 0.92 : 0.82), 0)) {
      ctx.restore();
      return;
    }
    const w = TW * 0.28, d = TH * 0.28, h = type === "cannon" ? 18 : type === "ice" ? 22 : 24;
    const x = base.x, y = base.y - 2;
    const wall = type === "arrow" ? "#7a5530" : type === "ice" ? "#7aa7c2" : "#5a5854";
    const wallL = type === "arrow" ? "#5a3a22" : type === "ice" ? "#5e7a90" : "#3d3c3a";
    const roof = type === "arrow" ? "#a07a4a" : type === "ice" ? "#8fe3f4" : "#2a2928";
    fillPoly([{x:x-w,y:y},{x:x,y:y+d},{x:x,y:y+d-h},{x:x-w,y:y-h}], wallL);
    fillPoly([{x:x+w,y:y},{x:x,y:y+d},{x:x,y:y+d-h},{x:x+w,y:y-h}], wall);
    fillPoly([{x:x-w,y:y-h},{x:x,y:y-h-d},{x:x+w,y:y-h},{x:x,y:y-h+d}], roof);
    ctx.fillStyle = "#3b2a18";
    ctx.fillRect(x - 3, y - h * 0.45, 6, h * 0.32);
    if (type === "arrow") {
      ctx.strokeStyle = "#e6c35c"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(x - 8, y - h - 6); ctx.lineTo(x + 8, y - h - 6); ctx.stroke();
    } else if (type === "ice") {
      ctx.fillStyle = "#7fe3f2";
      ctx.beginPath(); ctx.moveTo(x, y - h - 14); ctx.lineTo(x + 6, y - h - 2); ctx.lineTo(x - 6, y - h - 2); ctx.fill();
    } else {
      ctx.fillStyle = "#1a1918";
      ctx.fillRect(x - 2, y - h - 8, 14, 6);
    }
    ctx.restore();
  }

  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = "#6a8a4e";
    ctx.fillRect(0, 0, cssW, cssH);
    const grd = ctx.createRadialGradient(cssW*0.5, cssH*0.2, 20, cssW*0.5, cssH*0.5, cssW);
    grd.addColorStop(0, "rgba(255,255,220,0.12)");
    grd.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = grd; ctx.fillRect(0, 0, cssW, cssH);

    const cells = [];
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) cells.push({ c, r, z: c + r });
    cells.sort((a, b) => a.z - b.z);

    for (const cell of cells) {
      const { c, r } = cell;
      if (isPath(c, r)) {
        drawPrism(c, r, PH, "#c4a06a", "#8a6844", "#a4845a");
      } else {
        const top = ((c + r) & 1) ? "#3e7532" : "#4f8a3e";
        drawPrism(c, r, GH, top, "#6b4e2e", "#5a4026");
        if (besidePath(c, r)) drawPad(c, r);
      }
    }

    TREES.sort((a, b) => (a.c + a.r) - (b.c + b.r));
    for (const t of TREES) drawTree(t);

    const s0 = iso(PATH[0][0], PATH[0][1], PH);
    const s1 = iso(PATH[PATH_LEN-1][0], PATH[PATH_LEN-1][1], PH);
    ctx.font = "700 11px sans-serif"; ctx.textAlign = "center";
    ctx.fillStyle = "#2f6b3c"; ctx.fillText("入口", s0.x, s0.y - 18);
    ctx.fillStyle = "#7a3232"; ctx.fillText("出口", s1.x, s1.y - 18);

    if (state.selected && state.hover) {
      const { c, r } = state.hover;
      const valid = inGrid(c, r) && !isPath(c, r) && !state.occupied.has(key(c, r));
      const p = iso(c, r, GH + 2);
      ctx.beginPath();
      ctx.ellipse(p.x, p.y, TOWER_DEF[state.selected].range * TW * 0.42,
                  TOWER_DEF[state.selected].range * TH * 0.42, 0, 0, Math.PI * 2);
      ctx.strokeStyle = valid ? "rgba(230,195,92,0.8)" : "rgba(200,80,70,0.6)";
      ctx.lineWidth = 2; ctx.stroke();
      if (valid) drawHouse(c, r, state.selected, true);
    }

    const towersSorted = state.towers.slice().sort((a, b) => (a.c + a.r) - (b.c + b.r));
    for (const tw of towersSorted) drawHouse(tw.c, tw.r, tw.type, false);

    for (const f of state.fx) {
      const a = 1 - f.t / f.life;
      if (f.kind === "shot") {
        const p0 = iso(f.x0, f.y0, GH + 22), p1 = iso(f.x1, f.y1, PH + 10);
        ctx.strokeStyle = f.type === "ice" ? `rgba(140,220,240,${a})` :
                          f.type === "cannon" ? `rgba(230,140,70,${a})` : `rgba(230,210,150,${a})`;
        ctx.lineWidth = f.type === "cannon" ? 3.5 : 2;
        ctx.beginPath(); ctx.moveTo(p0.x, p0.y); ctx.lineTo(p1.x, p1.y); ctx.stroke();
      } else if (f.kind === "splash") {
        const p = iso(f.x, f.y, PH + 4);
        ctx.globalAlpha = a;
        if (!blit(IMG.splash, p.x, p.y + TH * 0.2, TW * (0.7 + f.t * 1.1), 0)) {
          const rad = TW * (0.18 + f.t * 1.4);
          ctx.beginPath(); ctx.ellipse(p.x, p.y, rad, rad * 0.5, 0, 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(255,120,30,${a * 0.9})`; ctx.lineWidth = 3; ctx.stroke();
          ctx.fillStyle = `rgba(230,90,20,${a * 0.18})`; ctx.fill();
        }
        ctx.globalAlpha = 1;
      } else if (f.kind === "place") {
        const p = iso(f.x, f.y, GH + 3);
        ctx.globalAlpha = a;
        if (!blit(IMG.place, p.x, p.y + TH * 0.15, TW * (0.7 + f.t * 0.6), 0)) {
          const rad = TW * (0.12 + f.t * 0.55);
          ctx.beginPath(); ctx.ellipse(p.x, p.y, rad, rad * 0.5, 0, 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(255,210,70,${a})`; ctx.lineWidth = 3; ctx.stroke();
        }
        ctx.globalAlpha = 1;
      }
    }

    const creepsSorted = state.creeps.slice().sort((a, b) => {
      const pa = creepPos(a), pb = creepPos(b);
      return (pa.x + pa.y) - (pb.x + pb.y);
    });
    for (const cr of creepsSorted) {
      const tp = creepPos(cr);
      const p = iso(tp.x, tp.y, PH + 8);
      const rad = TW * (cr.big ? 0.16 : 0.12);
      ctx.fillStyle = cr.slowT > 0 ? "rgba(80,180,220,0.35)" : "transparent";
      if (cr.slowT > 0) {
        if (!blit(IMG.slow, p.x, p.y + rad * 0.6, TW * 0.55, 0)) {
          ctx.beginPath(); ctx.ellipse(p.x, p.y + 4, rad * 1.6, rad * 0.7, 0, 0, Math.PI * 2); ctx.fill();
        }
      }
      ctx.fillStyle = cr.slowT > 0 ? "#3a6a7c" : "#1e1a24";
      ctx.beginPath(); ctx.ellipse(p.x, p.y, rad * 0.85, rad * 1.15, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = cr.slowT > 0 ? "#6ec7e0" : "#2c2733";
      ctx.beginPath(); ctx.ellipse(p.x, p.y - rad * 0.7, rad * 0.55, rad * 0.5, 0, 0, Math.PI * 2); ctx.fill();
      const bw = TW * 0.28, bh = 3;
      ctx.fillStyle = "rgba(0,0,0,0.5)";
      ctx.fillRect(p.x - bw / 2, p.y - rad * 1.5, bw, bh);
      ctx.fillStyle = cr.hp / cr.maxHp > 0.4 ? "#7dcf6a" : "#d45a4a";
      ctx.fillRect(p.x - bw / 2, p.y - rad * 1.5, bw * Math.max(0, cr.hp / cr.maxHp), bh);
    }

    for (const f of state.floats) {
      const p = iso(f.x, f.y, PH + 20);
      ctx.globalAlpha = 1 - f.t / 0.7;
      ctx.fillStyle = "#e6c35c";
      ctx.font = "bold 13px sans-serif"; ctx.textAlign = "center";
      ctx.fillText(f.text, p.x, p.y - f.t * 28);
      ctx.globalAlpha = 1;
    }

    if (state.phase === "countdown") {
      ctx.fillStyle = "rgba(20,28,14,0.4)";
      ctx.fillRect(cssW / 2 - 50, 12, 100, 36);
      ctx.fillStyle = "#f0d48a";
      ctx.font = "800 22px sans-serif"; ctx.textAlign = "center";
      ctx.fillText(Math.ceil(state.countdown) + " 秒", cssW / 2, 36);
    }
  }

  document.querySelectorAll(".card").forEach(btn => {
    btn.addEventListener("click", () => {
      const type = btn.dataset.type;
      if (state.gold < TOWER_DEF[type].cost) return;
      state.selected = state.selected === type ? null : type;
      hud();
    });
  });
  document.getElementById("restart").addEventListener("click", reset);
  function ptrToTile(ev) {
    const rect = canvas.getBoundingClientRect();
    return tileAtCss(ev.clientX - rect.left, ev.clientY - rect.top);
  }
  canvas.addEventListener("pointermove", ev => { state.hover = ptrToTile(ev); });
  canvas.addEventListener("pointerdown", ev => {
    ev.preventDefault();
    try { canvas.setPointerCapture(ev.pointerId); } catch (_) {}
    state.hover = ptrToTile(ev);
  });
  canvas.addEventListener("pointerup", ev => {
    const t = ptrToTile(ev);
    state.hover = t;
    if (t) tryPlace(t.c, t.r);
  });
  canvas.addEventListener("pointerleave", () => { state.hover = null; });
  canvas.addEventListener("contextmenu", ev => ev.preventDefault());
  window.addEventListener("resize", resize);
  new ResizeObserver(resize).observe(stage);
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now; update(dt); hud(); draw(); requestAnimationFrame(loop);
  }
  loadImages(() => { resize(); reset(); requestAnimationFrame(loop); });
})();
</script>
</body>
</html>
